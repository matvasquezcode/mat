<title>Calendrier EdgeQCMedia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ink header band with the next event, then the month grid (events drawn as bars that span their days) beside the day panel; a list view for reading everything in full. */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --ink: #0f1729;
  --muted: #5b6680;
  --line: #dfe4ee;
  --accent: #2456e6;
  --accent-ink: #ffffff;
  --accent-soft: #e6edff;
  --hero: #0f1729;
  --hero-ink: #f3f6fc;
  --hero-muted: #9aa8c4;
  --danger: #c0281b;
  --on-cat: #ffffff;

  --c-tournoi: #e2552a;
  --c-international: #cf2440;
  --c-championnat: #9a6a00;
  --c-equipeqc: #1f56d6;
  --c-repechage: #8a2bb8;
  --c-autre: #5f6c85;
  --c-post: #0b8a74;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --shadow: 0 1px 2px rgb(15 23 41 / .05), 0 8px 24px rgb(15 23 41 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d17; --surface: #121a2b; --surface-2: #0e1524; --ink: #e9eef8; --muted: #93a0bb; --line: #222d45;
    --accent: #7097ff; --accent-ink: #0a0f1b; --accent-soft: #1b2850; --hero: #121a2b; --hero-ink: #f3f6fc; --hero-muted: #93a0bb;
    --danger: #ff8b7c; --on-cat: #0a0f1b;
    --c-post: #3fd0b4; --c-tournoi: #ff9067; --c-international: #ff7a8c; --c-championnat: #f2c14e; --c-equipeqc: #7aa0ff; --c-repechage: #d48af0; --c-autre: #a3aec4;
    --shadow: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d17; --surface: #121a2b; --surface-2: #0e1524; --ink: #e9eef8; --muted: #93a0bb; --line: #222d45;
  --accent: #7097ff; --accent-ink: #0a0f1b; --accent-soft: #1b2850; --hero: #121a2b; --hero-ink: #f3f6fc; --hero-muted: #93a0bb;
  --danger: #ff8b7c; --on-cat: #0a0f1b;
  --c-post: #3fd0b4; --c-tournoi: #ff9067; --c-international: #ff7a8c; --c-championnat: #f2c14e; --c-equipeqc: #7aa0ff; --c-repechage: #d48af0; --c-autre: #a3aec4;
  --shadow: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; cursor: pointer; color: inherit; }

/* Hero */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: var(--r); padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between; border: 1px solid var(--line); }
.brand small { display: block; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--hero-muted); font-weight: 600; }
.brand h1 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 5.4vw, 46px); line-height: 1; letter-spacing: -.025em; }
.brand h1 span { color: var(--c-equipeqc); }
.brand-row { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.switch { display: inline-flex; align-self: flex-start; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 999px; padding: 3px; }
.switch[hidden] { display: none; }
.switch button { border: 0; background: transparent; color: var(--hero-muted); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; }
.switch button i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .7; }
.switch button[aria-pressed="true"] { background: var(--hero-ink); color: var(--hero); }
.switch button:focus-visible { outline: 2px solid var(--hero-ink); outline-offset: 2px; }
.lock { font-size: 12px; color: var(--hero-muted); }
.next { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 280px; max-width: 520px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); border-radius: 12px; padding: 12px 14px; text-align: left; }
.next[hidden] { display: none; }
.next .cal { flex: none; width: 52px; text-align: center; border-radius: 10px; background: var(--cat); color: var(--on-cat); padding: 5px 0 6px; line-height: 1.05; }
.next .cal b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 800; }
.next .cal span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.next .info { min-width: 0; }
.next .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--hero-muted); font-weight: 600; }
.next .ttl { font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
.next .sub { font-size: 13px; color: var(--hero-muted); overflow-wrap: anywhere; }
.next:hover { background: rgb(255 255 255 / .1); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.toolbar h2 { margin: 0 auto 0 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); letter-spacing: -.015em; text-transform: capitalize; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 20px; line-height: 1; }
.icon-btn:hover { border-color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
:is(.btn, .icon-btn, .seg button, .day, .bar, .ev, .next, .lcard):focus-visible, :is(input, select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* Month grid */
.month { overflow: hidden; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dow div { padding: 9px 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 0; border-bottom: 1px solid var(--line); min-height: 118px; }
.week:last-child { border-bottom: 0; }
.day { grid-row: 1 / -1; border: 0; border-right: 1px solid var(--line); background: transparent; padding: 6px 8px; text-align: left; display: flex; align-items: flex-start; justify-content: flex-start; min-width: 0; }
.day:nth-child(7) { border-right: 0; }
.day.wkend { background: var(--surface-2); }
.day:hover { background: var(--accent-soft); }
.day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.num { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; min-width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.out .num { color: var(--muted); opacity: .55; }
.day.today .num { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.head-spacer { grid-row: 1; height: 34px; pointer-events: none; }

.bar {
  position: relative; z-index: 1; margin: 0 5px 4px; border: 0; text-align: left; min-width: 0;
  border-radius: 6px; padding: 4px 8px; font-size: 12.5px; line-height: 1.3; font-weight: 600;
  overflow-wrap: break-word; hyphens: auto;
}
.bar.multi { background: var(--cat); color: var(--on-cat); }
.bar.single { background: color-mix(in srgb, var(--cat) 14%, var(--surface)); color: var(--ink); box-shadow: inset 3px 0 0 var(--cat); }
.bar.cont-l { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
.bar.cont-r { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.bar .tm { font-family: var(--f-mono); font-size: 11px; font-weight: 700; opacity: .85; margin-right: 4px; }
.bar .ln { display: block; font-weight: 500; font-size: 11.5px; opacity: .85; }
.bar.single .tm { color: var(--cat); opacity: 1; }
.bar:hover { filter: brightness(1.06); }
.bar.single:hover { background: color-mix(in srgb, var(--cat) 24%, var(--surface)); filter: none; }
@media (max-width: 640px) {
  .week { min-height: 76px; }
  .day { padding: 4px 2px; justify-content: center; }
  .num { min-width: 22px; height: 22px; font-size: 11.5px; }
  .head-spacer { height: 28px; }
  .dow div { padding: 7px 2px; text-align: center; letter-spacing: .04em; font-size: 10px; }
  .bar { margin: 0 2px 3px; padding: 3px 4px; font-size: 10.5px; line-height: 1.2; border-radius: 4px; }
  .bar.cont-l { margin-left: 0; } .bar.cont-r { margin-right: 0; }
  .bar .tm, .bar .ln { display: none; }
}

/* Side */
.side { display: flex; flex-direction: column; gap: 18px; }
.side section { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.side h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.side h3::first-letter { text-transform: uppercase; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ev { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: inset 4px 0 0 var(--cat); }
.ev:hover { background: var(--accent-soft); }
.ev .when { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
.ev .when b { display: block; color: var(--ink); font-size: 12.5px; }
.ev .t { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.ev .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cat); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); padding: 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--cat); }
.status { font-size: 13px; color: var(--muted); margin: 0; }
.status.err { color: var(--danger); }

/* List view */
.listview { padding: 6px 20px 20px; display: flex; flex-direction: column; }
.listview h4 { margin: 18px 0 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; text-transform: capitalize; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.lcard { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; }
.lcard:hover { border-color: var(--cat); }
.lcard .cal { text-align: center; border-radius: 10px; background: var(--cat); color: var(--on-cat); padding: 6px 0 7px; line-height: 1.05; }
.lcard .cal b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 800; }
.lcard .cal span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.lcard .cal small { display: block; font-size: 10px; font-weight: 600; margin-top: 2px; opacity: .9; }
.lcard .t { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; margin: 2px 0 4px; }
.lcard .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.lcard .notes { font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lcard.past { opacity: .6; }

/* Dialogs */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 0; width: min(540px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-shadow: 0 24px 60px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(6 10 20 / .55); }
form.ev-form { display: flex; flex-direction: column; gap: 14px; padding: 22px; }
form.ev-form h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr); } }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
label .hint { font-weight: 400; color: var(--muted); }
input, select, textarea { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { min-height: 84px; resize: vertical; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.cats button i { width: 10px; height: 10px; border-radius: 50%; background: var(--cat); }
.cats button[aria-pressed="true"] { border-color: var(--cat); background: color-mix(in srgb, var(--cat) 14%, var(--surface)); }
.err-msg { color: var(--danger); font-size: 13px; margin: -6px 0 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .spacer { margin-right: auto; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--danger) 10%, transparent); font-size: 14px; }

.detail { display: flex; flex-direction: column; }
.detail .band { background: var(--cat); color: var(--on-cat); padding: 18px 22px; }
.detail .band .k { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.detail .band h2 { margin: 4px 0 0; font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.detail .body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 16px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 14.5px; }
.detail dt { color: var(--muted); font-weight: 600; }
.detail dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.detail dd::first-letter { text-transform: uppercase; }
@media (prefers-reduced-motion: no-preference) { .day, .ev, .btn, .bar, .lcard, .next { transition: background-color .12s, border-color .12s, filter .12s; } }
</style>

<div class="wrap" lang="fr">
  <header class="hero">
    <div class="brand-row">
      <div class="switch" role="group" aria-label="Choisir le calendrier" id="calSwitch" hidden>
        <button type="button" id="calEdge" aria-pressed="true"><i></i>EdgeQC</button>
        <button type="button" id="calPerso" aria-pressed="false"><i></i>Personnel</button>
      </div>
      <div class="brand" id="brandEdge">
        <small>Agenda des événements</small>
        <h1>Edge<span>QC</span>Media</h1>
      </div>
      <div class="brand" id="brandPerso" hidden>
        <small>Calendrier personnel</small>
        <h1>Mon <span>agenda</span></h1>
        <div class="lock">🔒 Privé : toi seul le vois</div>
      </div>
    </div>
    <button class="next" id="nextCard" type="button" hidden></button>
  </header>

  <div class="toolbar">
    <h2 id="monthLabel">—</h2>
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" id="vMonth" aria-pressed="true">Mois</button>
      <button type="button" id="vList" aria-pressed="false">Liste</button>
    </div>
    <button class="icon-btn" id="prevBtn" type="button" aria-label="Mois précédent" title="Mois précédent">‹</button>
    <button class="btn" id="todayBtn" type="button">Aujourd'hui</button>
    <button class="icon-btn" id="nextBtn" type="button" aria-label="Mois suivant" title="Mois suivant">›</button>
    <button class="btn primary" id="addBtn" type="button" hidden>+ Ajouter un événement</button>
  </div>

  <div class="layout">
    <div>
      <div class="panel month" id="monthView">
        <div class="dow" aria-hidden="true"><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div>
        <div id="weeks"></div>
      </div>
      <div class="panel listview" id="listView" hidden></div>
    </div>

    <aside class="side">
      <div class="panel"><section>
        <h3 id="dayTitle">—</h3>
        <div class="list" id="dayList"></div>
        <button class="btn" id="addDayBtn" type="button" hidden>+ Ajouter à cette date</button>
      </section></div>
      <div class="panel"><section>
        <h3>À venir</h3>
        <div class="list" id="upList"></div>
        <p class="status" id="status">Chargement des événements…</p>
      </section></div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
</div>

<dialog id="formDlg">
  <form class="ev-form" id="evForm" novalidate>
    <h2 id="formTitle">Nouvel événement</h2>
    <label for="fTitle">Titre
      <input id="fTitle" name="title" maxlength="140" autocomplete="off" placeholder="ex. Challenge M15 AAA élite">
    </label>
    <p class="err-msg" id="titleErr" hidden>Donne un titre à l'événement.</p>
    <div class="row">
      <label for="fDate">Date de début <input id="fDate" name="date" type="date"></label>
      <label for="fEndDate">Date de fin <span class="hint">(si plusieurs jours)</span><input id="fEndDate" name="endDate" type="date"></label>
    </div>
    <p class="err-msg" id="dateErr" hidden></p>
    <div class="row">
      <label for="fStart">Heure de début <span class="hint">(optionnel)</span><input id="fStart" name="start" type="time"></label>
      <label for="fEnd">Heure de fin <span class="hint">(optionnel)</span><input id="fEnd" name="end" type="time"></label>
    </div>
    <div>
      <label id="catLbl" style="margin-bottom:6px">Catégorie</label>
      <div class="cats" id="catPick" role="group" aria-labelledby="catLbl"></div>
    </div>
    <label for="fLoc">Lieu <span class="hint">(optionnel)</span><input id="fLoc" name="loc" maxlength="140" autocomplete="off"></label>
    <label for="fNotes">Notes <span class="hint">(optionnel)</span><textarea id="fNotes" name="notes" maxlength="2000"></textarea></label>
    <div class="confirm" id="confirmBox" hidden>
      <span>Supprimer « <b id="confirmName"></b> » ?</span>
      <button class="btn danger" type="button" id="confirmYes">Supprimer</button>
      <button class="btn" type="button" id="confirmNo">Garder</button>
    </div>
    <p class="err-msg" id="saveErr" hidden></p>
    <div class="actions">
      <button class="btn danger spacer" type="button" id="delBtn" hidden>Supprimer</button>
      <button class="btn" type="button" id="cancelBtn">Annuler</button>
      <button class="btn primary" type="submit" id="saveBtn">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="detailDlg">
  <div class="detail" id="detailBox">
    <div class="band"><div class="k" id="dTag"></div><h2 id="dTitle"></h2></div>
    <div class="body">
      <dl id="dList"></dl>
      <div class="actions">
        <button class="btn" type="button" id="dClose">Fermer</button>
        <button class="btn primary" type="button" id="dEdit" hidden>Modifier</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const CATS_PERSO = [
  { id: "rdv", label: "Rendez-vous", tok: "equipeqc" },
  { id: "travail", label: "Travail / école", tok: "tournoi" },
  { id: "sport", label: "Sport", tok: "international" },
  { id: "sortie", label: "Sorties / amis", tok: "repechage" },
  { id: "important", label: "Important", tok: "championnat" },
  { id: "autre", label: "Autre" },
];
const CATS_EDGE = [
  { id: "post", label: "Publication" },
  { id: "tournoi", label: "Tournoi" },
  { id: "international", label: "International" },
  { id: "championnat", label: "Championnat canadien" },
  { id: "equipeqc", label: "Équipe Québec" },
  { id: "repechage", label: "Repêchage" },
  { id: "autre", label: "Autre" },
];
let CATS = CATS_EDGE;
const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const catVar = id => `var(--c-${catOf(id).tok || catOf(id).id})`;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const endOf = e => (e.endDate && e.endDate > e.date) ? e.endDate : e.date;
const spanDays = e => dayNum(endOf(e)) - dayNum(e.date) + 1;

const fmtMonth = new Intl.DateTimeFormat("fr-CA", { month: "long", year: "numeric" });
const fmtDayLong = new Intl.DateTimeFormat("fr-CA", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = new Intl.DateTimeFormat("fr-CA", { day: "numeric", month: "short" });
const fmtMon = new Intl.DateTimeFormat("fr-CA", { month: "short" });
const fmtFull = new Intl.DateTimeFormat("fr-CA", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fmtTime = t => t ? t.replace(":", " h ") : "";
const rangeText = e => spanDays(e) > 1
  ? `${fmtShort.format(parseIso(e.date))} → ${fmtShort.format(parseIso(endOf(e)))} · ${spanDays(e)} jours`
  : fmtShort.format(parseIso(e.date));

const todayIso = iso(new Date());
let view = new Date(); view.setDate(1);
let selected = todayIso;
let mode = "month";
let events = [];
let db = null, canWrite = false, editingId = null, detailId = null, pickedCat = "tournoi";
let cal = "edge", uid = null, canEdge = false;
const byCal = { edge: [], perso: [] };
const statusByCal = { edge: "Chargement des événements…", perso: "Chargement de ton agenda…" };
const errByCal = { edge: false, perso: false };

try { if (localStorage.getItem("edgeqc-view") === "list") mode = "list"; } catch {}
try { if (localStorage.getItem("edgeqc-cal") === "perso") cal = "perso"; } catch {}

const colRef = () => cal === "perso" ? db.collection("data/users/" + uid) : db.collection("events");
function applyCal() {
  if (cal === "perso" && !uid) cal = "edge";
  CATS = cal === "perso" ? CATS_PERSO : CATS_EDGE;
  events = byCal[cal];
  canWrite = cal === "perso" ? !!uid : canEdge;
  $("addBtn").hidden = !canWrite;
  $("brandEdge").hidden = cal !== "edge"; $("brandPerso").hidden = cal !== "perso";
  $("calEdge").setAttribute("aria-pressed", cal === "edge"); $("calPerso").setAttribute("aria-pressed", cal === "perso");
  $("status").textContent = statusByCal[cal]; $("status").classList.toggle("err", errByCal[cal]);
  if (detailId && !events.some(e => e.id === detailId) && $("detailDlg").open) $("detailDlg").close();
  renderLegend();
}
function setCal(c) { cal = c; try { localStorage.setItem("edgeqc-cal", c); } catch {} applyCal(); renderAll(); }

const sortEvents = list => list.slice().sort((a, b) =>
  (a.date + (a.start || "00:00")).localeCompare(b.date + (b.start || "00:00")) || spanDays(b) - spanDays(a));
const eventsOn = day => sortEvents(events.filter(e => e.date <= day && endOf(e) >= day));

function renderLegend() {
  $("legend").replaceChildren(...CATS.map(c => { const s = el("span"); s.style.setProperty("--cat", catVar(c.id)); s.append(el("i"), c.label); return s; }));
}

/* ---------- Month grid with spanning bars ---------- */
function renderMonth() {
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const gridStart = iso(new Date(first.getFullYear(), first.getMonth(), 1 - offset));
  const lastDay = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const nWeeks = Math.ceil((offset + lastDay) / 7);
  const weeks = [];

  for (let w = 0; w < nWeeks; w++) {
    const wStart = addDays(gridStart, w * 7), wEnd = addDays(wStart, 6);
    const segs = sortEvents(events.filter(e => e.date <= wEnd && endOf(e) >= wStart));
    const lanes = [];
    const placed = segs.map(e => {
      const c0 = Math.max(0, dayNum(e.date) - dayNum(wStart));
      const c1 = Math.min(6, dayNum(endOf(e)) - dayNum(wStart));
      let lane = lanes.findIndex(l => l.every((used, i) => i < c0 || i > c1 || !used));
      if (lane < 0) { lane = lanes.length; lanes.push(Array(7).fill(false)); }
      for (let i = c0; i <= c1; i++) lanes[lane][i] = true;
      return { e, c0, c1, lane };
    });

    const wk = el("div", "week");
    wk.style.gridTemplateRows = `auto ${lanes.length ? `repeat(${lanes.length}, auto)` : ""} 1fr`;
    for (let i = 0; i < 7; i++) {
      const key = addDays(wStart, i), d = parseIso(key);
      const b = el("button", "day"); b.type = "button";
      b.style.gridColumn = String(i + 1);
      if (d.getMonth() !== view.getMonth()) b.classList.add("out");
      if (i >= 5) b.classList.add("wkend");
      if (key === todayIso) b.classList.add("today");
      if (key === selected) b.classList.add("sel");
      const n = eventsOn(key).length;
      b.setAttribute("aria-label", `${fmtDayLong.format(d)}, ${n} événement${n > 1 ? "s" : ""}`);
      b.append(el("span", "num", d.getDate()));
      b.addEventListener("click", () => selectDay(key));
      b.addEventListener("dblclick", () => { if (canWrite) openForm(null, key); });
      wk.append(b);
    }
    const sp = el("div", "head-spacer"); sp.style.gridColumn = "1 / -1"; wk.append(sp);

    placed.forEach(({ e, c0, c1, lane }) => {
      const multi = spanDays(e) > 1;
      const bar = el("button", "bar " + (multi ? "multi" : "single")); bar.type = "button";
      bar.style.setProperty("--cat", catVar(e.cat));
      bar.style.gridColumn = `${c0 + 1} / ${c1 + 2}`;
      bar.style.gridRow = String(lane + 2);
      if (e.date < wStart) bar.classList.add("cont-l");
      if (endOf(e) > wEnd) bar.classList.add("cont-r");
      if (e.start && (!multi || e.date >= wStart)) bar.append(el("span", "tm", e.start));
      bar.append((e.date < wStart ? "← " : "") + e.title + (endOf(e) > wEnd ? " →" : ""));
      if (e.loc && (c1 - c0 >= 1 || !multi)) bar.append(el("span", "ln", e.loc));
      bar.title = `${e.title} — ${rangeText(e)}${e.start ? " · " + fmtTime(e.start) : ""}${e.loc ? " · " + e.loc : ""}`;
      bar.addEventListener("click", () => openDetail(e.id));
      wk.append(bar);
    });
    weeks.push(wk);
  }
  $("weeks").replaceChildren(...weeks);
}

/* ---------- List view ---------- */
function renderList() {
  const box = $("listView");
  const all = sortEvents(events);
  if (!all.length) {
    const p = el("p", "empty", canWrite ? "Aucun événement encore. Clique sur « Ajouter un événement » pour mettre le premier." : "Aucun événement pour l'instant.");
    p.style.padding = "18px 0"; box.replaceChildren(p); return;
  }
  const groups = new Map();
  all.forEach(e => { const k = e.date.slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const out = [];
  groups.forEach((list, k) => {
    out.push(el("h4", null, fmtMonth.format(parseIso(k + "-01"))));
    const g = el("div", "lgrid");
    list.forEach(e => g.append(listCard(e)));
    out.push(g);
  });
  box.replaceChildren(...out);
}
function listCard(e) {
  const c = el("button", "lcard"); c.type = "button"; c.style.setProperty("--cat", catVar(e.cat));
  if (endOf(e) < todayIso) c.classList.add("past");
  const cal = el("div", "cal"); const d = parseIso(e.date);
  cal.append(el("b", null, d.getDate()), el("span", null, fmtMon.format(d).replace(".", "")));
  if (spanDays(e) > 1) cal.append(el("small", null, `${spanDays(e)} jours`));
  const body = el("div"); body.style.minWidth = "0";
  body.append(el("span", "tag", catOf(e.cat).label), el("div", "t", e.title));
  const bits = [rangeText(e)];
  if (e.start) bits.push(fmtTime(e.start) + (e.end ? " à " + fmtTime(e.end) : ""));
  if (e.loc) bits.push(e.loc);
  body.append(el("div", "meta", bits.join(" · ")));
  if (e.notes) body.append(el("div", "notes", e.notes));
  c.append(cal, body);
  c.addEventListener("click", () => openDetail(e.id));
  return c;
}

/* ---------- Side ---------- */
function evButton(e, showDate) {
  const b = el("button", "ev"); b.type = "button"; b.style.setProperty("--cat", catVar(e.cat));
  const w = el("div", "when");
  if (showDate) w.append(el("b", null, fmtShort.format(parseIso(e.date))));
  w.append(spanDays(e) > 1 ? `${spanDays(e)} jours` : (e.start || "Journée"));
  const body = el("div"); body.style.minWidth = "0";
  body.append(el("span", "tag", catOf(e.cat).label), el("div", "t", e.title));
  const meta = [];
  if (spanDays(e) > 1) meta.push(rangeText(e).split(" · ")[0]);
  if (e.loc) meta.push(e.loc);
  if (meta.length) body.append(el("div", "meta", meta.join(" · ")));
  b.append(w, body);
  b.addEventListener("click", () => openDetail(e.id));
  return b;
}
function renderSide() {
  const d = parseIso(selected);
  $("dayTitle").textContent = (selected === todayIso ? "Aujourd'hui · " : "") + fmtDayLong.format(d);
  const day = eventsOn(selected);
  $("dayList").replaceChildren(...(day.length ? day.map(e => evButton(e, false))
    : [el("p", "empty", canWrite ? "Rien de prévu cette journée." : "Rien de prévu cette journée.")]));
  $("addDayBtn").hidden = !canWrite;
  const up = sortEvents(events.filter(e => endOf(e) >= todayIso)).slice(0, 8);
  $("upList").replaceChildren(...(up.length ? up.map(e => evButton(e, true))
    : [el("p", "empty", canWrite ? "Aucun événement à venir. Clique sur « Ajouter un événement » pour mettre le premier." : "Aucun événement à venir pour l'instant.")]));

  const nx = up[0], card = $("nextCard");
  if (!nx) { card.hidden = true; return; }
  card.hidden = false; card.style.setProperty("--cat", catVar(nx.cat));
  const nd = parseIso(nx.date);
  const cal = el("div", "cal"); cal.append(el("b", null, nd.getDate()), el("span", null, fmtMon.format(nd).replace(".", "")));
  const info = el("div", "info");
  const live = nx.date <= todayIso;
  info.append(el("div", "lbl", live ? "En cours" : "Prochain événement"), el("div", "ttl", nx.title));
  const sub = [rangeText(nx)]; if (nx.start) sub.push(fmtTime(nx.start)); if (nx.loc) sub.push(nx.loc);
  info.append(el("div", "sub", sub.join(" · ")));
  card.replaceChildren(cal, info);
  card.onclick = () => openDetail(nx.id);
}

function renderAll() {
  $("monthLabel").textContent = mode === "month" ? fmtMonth.format(view) : "Tous les événements";
  $("monthView").hidden = mode !== "month"; $("listView").hidden = mode !== "list";
  $("prevBtn").hidden = $("nextBtn").hidden = $("todayBtn").hidden = mode !== "month";
  $("vMonth").setAttribute("aria-pressed", mode === "month"); $("vList").setAttribute("aria-pressed", mode === "list");
  if (mode === "month") renderMonth(); else renderList();
  renderSide();
}
function selectDay(key) {
  selected = key;
  const d = parseIso(key);
  if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) view = new Date(d.getFullYear(), d.getMonth(), 1);
  renderAll();
}
function setMode(m) { mode = m; try { localStorage.setItem("edgeqc-view", m); } catch {} renderAll(); }

/* ---------- Form ---------- */
function renderCatPick() {
  $("catPick").replaceChildren(...CATS.map(c => {
    const b = el("button"); b.type = "button"; b.style.setProperty("--cat", catVar(c.id));
    b.setAttribute("aria-pressed", c.id === pickedCat); b.append(el("i"), c.label);
    b.addEventListener("click", () => { pickedCat = c.id; renderCatPick(); });
    return b;
  }));
}
function openForm(id, date) {
  editingId = id;
  const e = id ? events.find(x => x.id === id) : null;
  $("formTitle").textContent = e ? "Modifier l'événement" : "Nouvel événement";
  $("fTitle").value = e?.title || "";
  $("fDate").value = e?.date || date || selected;
  $("fEndDate").value = e && spanDays(e) > 1 ? endOf(e) : "";
  $("fStart").value = e?.start || "";
  $("fEnd").value = e?.end || "";
  pickedCat = e ? catOf(e.cat).id : CATS[0].id; renderCatPick();
  $("fLoc").value = e?.loc || "";
  $("fNotes").value = e?.notes || "";
  $("delBtn").hidden = !e;
  ["titleErr", "dateErr", "saveErr", "confirmBox"].forEach(k => $(k).hidden = true);
  $("formDlg").showModal();
  $("fTitle").focus();
}
function checkDates() {
  const s = $("fDate").value, e = $("fEndDate").value;
  let msg = "";
  if (!s) msg = "Choisis une date de début.";
  else if (e && e < s) msg = "La date de fin doit être après la date de début.";
  $("dateErr").textContent = msg; $("dateErr").hidden = !msg;
  return !msg;
}
$("fTitle").addEventListener("blur", () => { $("titleErr").hidden = !!$("fTitle").value.trim(); });
$("fTitle").addEventListener("input", () => { if ($("fTitle").value.trim()) $("titleErr").hidden = true; });
$("fDate").addEventListener("change", () => { if (!$("dateErr").hidden) checkDates(); });
$("fEndDate").addEventListener("change", checkDates);
$("cancelBtn").addEventListener("click", () => $("formDlg").close());

$("evForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const title = $("fTitle").value.trim();
  $("titleErr").hidden = !!title;
  const datesOk = checkDates();
  if (!title) { $("fTitle").focus(); return; }
  if (!datesOk) { $("fDate").focus(); return; }
  const date = $("fDate").value, endDate = $("fEndDate").value;
  const data = {
    title, date, endDate: endDate && endDate > date ? endDate : "",
    start: $("fStart").value || "", end: $("fEnd").value || "",
    cat: pickedCat, loc: $("fLoc").value.trim(), notes: $("fNotes").value.trim(),
  };
  $("saveBtn").disabled = true; $("saveErr").hidden = true;
  try {
    const col = colRef();
    if (editingId) await col.doc(editingId).set(data); else await col.add(data);
    $("formDlg").close(); selectDay(date);
  } catch (err) {
    $("saveErr").textContent = err?.code === "invalid_argument"
      ? "Ton accès ne permet pas de modifier ce calendrier. Demande au propriétaire un accès Éditeur."
      : "L'événement n'a pas été enregistré. Vérifie ta connexion et réessaie.";
    $("saveErr").hidden = false;
  } finally { $("saveBtn").disabled = false; }
});

$("delBtn").addEventListener("click", () => { $("confirmName").textContent = $("fTitle").value || "cet événement"; $("confirmBox").hidden = false; $("confirmYes").focus(); });
$("confirmNo").addEventListener("click", () => { $("confirmBox").hidden = true; });
$("confirmYes").addEventListener("click", async () => {
  try { await colRef().doc(editingId).delete(); $("formDlg").close(); }
  catch { $("saveErr").textContent = "La suppression n'a pas fonctionné. Réessaie."; $("saveErr").hidden = false; }
});

/* ---------- Detail ---------- */
function openDetail(id) {
  const e = events.find(x => x.id === id); if (!e) return;
  detailId = id;
  $("detailBox").style.setProperty("--cat", catVar(e.cat));
  $("dTag").textContent = catOf(e.cat).label;
  $("dTitle").textContent = e.title;
  const rows = spanDays(e) > 1
    ? [["Du", fmtFull.format(parseIso(e.date))], ["Au", fmtFull.format(parseIso(endOf(e)))], ["Durée", `${spanDays(e)} jours`]]
    : [["Date", fmtFull.format(parseIso(e.date))]];
  if (e.start) rows.push(["Heure", fmtTime(e.start) + (e.end ? " à " + fmtTime(e.end) : "")]);
  if (e.loc) rows.push(["Lieu", e.loc]);
  if (e.notes) rows.push(["Notes", e.notes]);
  $("dList").replaceChildren(...rows.flatMap(([k, v]) => [el("dt", null, k), el("dd", null, v)]));
  $("dEdit").hidden = !canWrite;
  $("detailDlg").showModal();
}
$("dClose").addEventListener("click", () => $("detailDlg").close());
$("dEdit").addEventListener("click", () => { $("detailDlg").close(); openForm(detailId); });
[$("formDlg"), $("detailDlg")].forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

/* ---------- Nav ---------- */
$("prevBtn").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderAll(); });
$("nextBtn").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderAll(); });
$("todayBtn").addEventListener("click", () => selectDay(todayIso));
$("vMonth").addEventListener("click", () => setMode("month"));
$("vList").addEventListener("click", () => setMode("list"));
$("calEdge").addEventListener("click", () => setCal("edge"));
$("calPerso").addEventListener("click", () => setCal("perso"));
$("addBtn").addEventListener("click", () => openForm(null, selected));
$("addDayBtn").addEventListener("click", () => openForm(null, selected));

renderLegend(); renderAll();

/* ---------- Data ---------- */
(async () => {
  const status = $("status");
  if (!window.claude?.use) { status.textContent = "Ouvre ce calendrier dans Claude pour voir les événements."; return; }
  const [dbNs, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!dbNs) { status.textContent = "Connecte-toi pour voir les événements."; return; }
  db = dbNs;
  const can = user ? await user.can("data.write") : null;
  canEdge = can === null ? true : !!can;
  uid = user ? await user.id() : null;
  $("calSwitch").hidden = !uid;
  applyCal(); renderAll();

  const listen = (key, ref, label) => {
    const timer = setTimeout(() => { statusByCal[key] = "Les événements ne répondent pas encore. Ils s'afficheront dès que la connexion revient."; if (cal === key) applyCal(); }, 10000);
    ref.onSnapshot(snap => {
      byCal[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => typeof e.date === "string" && e.title);
      if (!snap.metadata.fromCache) { clearTimeout(timer); const n = byCal[key].length; statusByCal[key] = `${n} événement${n > 1 ? "s" : ""} ${label}`; errByCal[key] = false; }
      if (cal === key) { applyCal(); renderAll(); }
    }, () => {
      clearTimeout(timer);
      statusByCal[key] = "Impossible de charger les événements. Recharge la page plus tard."; errByCal[key] = true;
      if (cal === key) applyCal();
    });
  };
  listen("edge", db.collection("events"), "au calendrier EdgeQC");
  if (uid) listen("perso", db.collection("data/users/" + uid), "dans ton agenda");
})();
</script>
